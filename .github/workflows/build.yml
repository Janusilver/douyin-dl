# 自动打包 release：push v* 标签或手动触发
name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yt-dlp curl_cffi pyinstaller imageio-ffmpeg

      - name: Prepare portable ffmpeg
        shell: python
        run: |
          import shutil
          import imageio_ffmpeg
          from pathlib import Path
          Path("ffmpeg").mkdir(exist_ok=True)
          shutil.copy2(imageio_ffmpeg.get_ffmpeg_exe(), "ffmpeg/ffmpeg.exe")

      - name: Build exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name 多平台下载器 `
            --collect-all yt_dlp `
            --collect-all curl_cffi `
            --add-data "ffmpeg/ffmpeg.exe;ffmpeg" `
            gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 多平台下载器-windows
          path: dist/多平台下载器.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/多平台下载器.exe
          generate_release_notes: true
